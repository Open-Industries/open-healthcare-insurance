asyncapi: 2.6.0
info:
  title: Open Healthcare Insurance — Reference Health Coverage Core Platform — Domain Events
  version: 1.0.0
  description: >
    CloudEvents 1.0 envelopes published by the platform's bounded contexts.
    Consumers MUST be idempotent and tolerate unknown fields. Ordering is
    guaranteed only per aggregate (the CloudEvent `subject`).
servers:
  production:
    url: kafka://broker.healthcare.svc.cluster.local:9092
    protocol: kafka
    description: Kafka-backed Knative Broker in production; Knative Broker abstraction elsewhere.
channels:
  member.created:
    publish:
      operationId: on-member-created
      message: { $ref: '#/components/messages/Generic' }
  coverage.created:
    publish:
      operationId: on-coverage-created
      message: { $ref: '#/components/messages/Generic' }
  adjudication.created:
    publish:
      operationId: on-adjudication-created
      message: { $ref: '#/components/messages/Generic' }
  provider.created:
    publish:
      operationId: on-provider-created
      message: { $ref: '#/components/messages/Generic' }
  notification.created:
    publish:
      operationId: on-notification-created
      message: { $ref: '#/components/messages/Generic' }
  claimfraud.evaluated:
    publish:
      operationId: on-claimfraud-evaluated
      message: { $ref: '#/components/messages/Generic' }
  adequacy.evaluated:
    publish:
      operationId: on-adequacy-evaluated
      message: { $ref: '#/components/messages/Generic' }
components:
  messages:
    Generic: { payload: { $ref: '#/components/schemas/CloudEvent' } }
  schemas:
    CloudEvent:
      type: object
      required: [specversion, id, source, type, time]
      properties:
        specversion: { type: string, enum: ['1.0'] }
        id: { type: string, format: uuid }
        source: { type: string, example: '/open-healthcare-insurance/service' }
        type: { type: string, example: 'context.event' }
        subject: { type: string, description: Aggregate id (ordering key). }
        time: { type: string, format: date-time }
        datacontenttype: { type: string, enum: [application/json] }
        data: { type: object }
