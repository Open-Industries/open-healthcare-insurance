openapi: 3.1.0
info:
  title: Open Healthcare Insurance — Reference Health Coverage Core Platform — aggregate contract
  version: 1.0.0
  description: >
    Aggregate view of the platform's public REST contracts. The normative per-service
    contracts are generated from code by Quarkus SmallRye OpenAPI at `/openapi` on each
    service; CI diffs them against this file (see docs/api/api-standards.md).
    Conventions: RFC 9457 errors, Idempotency-Key on creates, lifecycle transitions
    take no body, explicit units on every quantity, all data synthetic.
servers:
  - url: https://api.example.org/api/v1
    description: Production (per adopter)
security:
  - bearerAuth: []
paths:
  /members:
    post:
      operationId: create-member
      summary: "Member registry; the member number is masked at enrolment and never kept in clear."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /coverage:
    post:
      operationId: create-coverage
      summary: "Guarded coverage-limit accounts per member and the claim payments against them."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /adjudication-rules:
    post:
      operationId: create-adjudication
      summary: "Decision rules binding claim types to amount and processing envelopes, with reasons."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /providers:
    post:
      operationId: create-provider
      summary: "Contracted provider network catalogue."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /notifications:
    post:
      operationId: dispatch-notification
      summary: Dispatch a notification
      responses:
        '202': { description: Accepted }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
